services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: 3001
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env before deploying}
      GEMINI_API_BASE: ${GEMINI_API_BASE:-https://generativelanguage.googleapis.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PROXY_ACCESS_LOG: ${PROXY_ACCESS_LOG:-true}
    expose:
      - "3001"
    networks:
      - ai_net
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    environment:
      RUNTIME_SERVER_MANAGED_API: ${RUNTIME_SERVER_MANAGED_API:-true}
      RUNTIME_USE_CUSTOM_API_CONFIG: ${RUNTIME_USE_CUSTOM_API_CONFIG:-true}
      RUNTIME_USE_API_PROXY: ${RUNTIME_USE_API_PROXY:-true}
      RUNTIME_API_PROXY_URL: ${RUNTIME_API_PROXY_URL:-/api/gemini}
    expose:
      - "80"
    networks:
      ai_net:
        aliases:
          - amc-web
    restart: unless-stopped

networks:
  ai_net:
    external: true
